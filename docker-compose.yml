services:
  postgres:
    image: postgres:16-alpine
    container_name: pethub-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pethub
    ports:
      - '5432:5432'
    volumes:
      - pethub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pethub']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pethub_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pethub-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: pethub
      DB_SCHEMA: public
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/pethub?schema=public
      JWT_SECRET: pethub_jwt_access_secret_key_2026_super_secure
      JWT_REFRESH_SECRET: pethub_jwt_refresh_secret_key_2026_super_secure
      JWT_ACCESS_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 30d
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./files:/app/files
    networks:
      - pethub_net

volumes:
  pethub_postgres_data:
    driver: local

networks:
  pethub_net:
    driver: bridge
