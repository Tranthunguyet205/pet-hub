services:
  postgres:
    image: postgres:16-alpine
    container_name: pethub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-pethub}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pethub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pethub}' ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pethub_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pethub-backend
    restart: always
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # Inside Docker, reach Postgres by service name, not localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-pethub}?schema=${DB_SCHEMA:-public}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./files:/app/files
    networks:
      - pethub_net
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: pethub-ngrok
  #   restart: always
  #   environment:
  #     NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  #   command:
  #     - 'http'
  #     - '--url=${NGROK_DOMAIN}'
  #     - 'backend:${PORT:-3000}'
  #   depends_on:
  #     - backend
  #   networks:
  #     - pethub_net

volumes:
  pethub_postgres_data:
    driver: local

networks:
  pethub_net:
    driver: bridge
